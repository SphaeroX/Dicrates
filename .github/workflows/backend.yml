name: Backend

on:
  push:
    branches: [main]
    paths: ['backend/**', 'supabase/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'supabase/**', '.github/workflows/backend.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install 3.14
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest -m "not integration and not llm"

  integration:
    runs-on: ubuntu-latest
    env:
      DICRATES_REQUIRE_DB: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase (applies supabase/migrations)
        working-directory: .
        run: supabase start
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install 3.14
      - run: uv sync --locked
      - run: uv run pytest -m integration
