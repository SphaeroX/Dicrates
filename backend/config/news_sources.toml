# Curated news feeds for the debate question pipeline (Task 07).
# Approved by the operator on 2026-11-05: a broad spectrum of German and
# international outlets with public RSS feeds.
#
# Only title, link, date and the feed's own short text are stored (7 days),
# never full articles. Questions link back to the original article.
# `leaning` is a rough orientation to keep the mix balanced, not a judgement.
# `terms_note`: feed terms must be confirmed before the public release
# (Tasks 25/28); most outlets allow non-commercial feed use with attribution.

