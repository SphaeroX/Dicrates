# Curated timeless and historical debate topics (Task 08).
# Topic list approved by the operator on 2026-11-05.
# Sensitive topics are allowed when the question is neutral and asks about a
# policy, never about whether a group of people deserves rights (operator, 2026-11-05).
#
# Add a topic: new [[topics]] block with a unique `id` (lowercase, underscores),
# `topic_area` (politics, economy, society, environment, technology, sports,
# culture, education, health), `kind` (evergreen | historical), an optional
# `guiding_question` and 1-6 trustworthy `sources` (encyclopedias, bpb, parliament
# documents, statistics offices). Then: dicrates-admin questions generate --evergreen --topic <id>

