[project]
name = "dicrates-backend"
version = "0.0.0"
description = "Dicrates API and job worker (FastAPI, Procrastinate, Pydantic AI)."
readme = "../README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "pyright",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a running Postgres (Supabase local stack)",
    "llm: calls the real LLM provider; never run in CI by default",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ASYNC", "S", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
typeCheckingMode = "strict"
